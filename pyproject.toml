[project]
name = "co-extract"
version = "0.1.0"
description = "Change-order PDFs/text to validated JSON with per-field confidence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.46.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "python-dateutil>=4.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
co-extract = "co_extract.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
